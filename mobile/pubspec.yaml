name: tagfind
description: TagFind — Rastreamento colaborativo de ativos via BLE.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Supabase
  supabase_flutter: ^2.7.0

  # BLE
  flutter_blue_plus: ^1.32.12

  # Location & Permissions
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  win_ble: ^1.1.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
